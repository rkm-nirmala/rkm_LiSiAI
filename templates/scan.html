{% extends "base.html" %}

{% block title %}Scan sampul · LiSiAI{% endblock %}

{% block content %}
  <section class="page-heading">
    <h1>Scan sampul buku</h1>
    <p>Arahkan sampul ke kamera. Gambar akan diambil otomatis setelah OpenCV mendeteksi teks.</p>
  </section>
  <section class="scanner-grid">
    <div class="panel scanner-panel">
      <div class="camera-view">
        <video id="camera" autoplay muted playsinline aria-label="Tampilan kamera untuk scan sampul"></video>
        <img id="captured-preview" alt="Foto sampul yang diambil" hidden>
        <div id="camera-guide" class="camera-guide" aria-hidden="true"></div>
        <p id="camera-status" class="camera-status" role="status" aria-live="polite">Membuka kamera...</p>
      </div>
      <div class="camera-actions">
        <button id="capture" class="button button-secondary" type="button" disabled>Ambil gambar sekarang</button>
        <button id="retake" class="button button-secondary" type="button" hidden>Foto ulang</button>
      </div>
    </div>
    <div class="panel results-panel">
      <label for="extracted-text">Hasil teks — bisa diedit</label>
      <textarea id="extracted-text" name="text" rows="7" placeholder="Hasil bacaan sampul akan muncul di sini." autocomplete="off"></textarea>
      <button id="ask-ai" class="button" type="button" disabled>Tanya AI</button>
      <p id="ai-result" class="ai-result" role="status" aria-live="polite"></p>
    </div>
  </section>
  <canvas id="capture-canvas" hidden></canvas>
  <script>
    const video = document.querySelector("#camera");
    const preview = document.querySelector("#captured-preview");
    const guide = document.querySelector("#camera-guide");
    const status = document.querySelector("#camera-status");
    const captureButton = document.querySelector("#capture");
    const retakeButton = document.querySelector("#retake");
    const askButton = document.querySelector("#ask-ai");
    const aiResult = document.querySelector("#ai-result");
    const canvas = document.querySelector("#capture-canvas");
    const textField = document.querySelector("#extracted-text");
    const context = canvas.getContext("2d");
    const sampleCanvas = document.createElement("canvas");
    sampleCanvas.width = 160;
    sampleCanvas.height = 120;
    const sampleContext = sampleCanvas.getContext("2d", { willReadFrequently: true });

    let cameraStream;
    let previewUrl;
    let captureInProgress = false;
    let detectionInProgress = false;
    let consecutiveTextFrames = 0;
    let autoCapture = true;

    function stopCamera() {
      cameraStream?.getTracks().forEach((track) => track.stop());
      cameraStream = null;
      video.srcObject = null;
    }

    async function inspectFrame() {
      if (!autoCapture || captureInProgress || detectionInProgress) return;
      if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
        window.setTimeout(inspectFrame, 300);
        return;
      }

      sampleContext.drawImage(video, 0, 0, sampleCanvas.width, sampleCanvas.height);
      detectionInProgress = true;
      try {
        const blob = await new Promise((resolve) => sampleCanvas.toBlob(resolve, "image/jpeg", 0.5));
        if (!blob) throw new Error("Frame kamera tidak dapat dibuat.");
        const formData = new FormData();
        formData.append("image", blob, "frame.jpg");
        const response = await fetch("/detect-text", { method: "POST", body: formData });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Deteksi teks gagal.");

        consecutiveTextFrames = result.text_detected ? consecutiveTextFrames + 1 : 0;
        if (consecutiveTextFrames >= 3) {
          status.textContent = "Teks terdeteksi. Mengambil foto sampul...";
          await captureImage();
          return;
        }
        status.textContent = result.text_detected
          ? "Pola teks terdeteksi. Tahan posisi kamera..."
          : "Arahkan sampul ke kamera. Menunggu teks terdeteksi...";
      } catch (error) {
        consecutiveTextFrames = 0;
        status.textContent = `Deteksi lokal tidak tersedia: ${error.message}`;
      } finally {
        detectionInProgress = false;
      }

      if (autoCapture) window.setTimeout(inspectFrame, 700);
    }

    async function captureImage() {
      if (captureInProgress || !video.videoWidth) return;
      captureInProgress = true;
      autoCapture = false;
      captureButton.disabled = true;
      status.textContent = "Menyiapkan foto sampul...";

      const scale = Math.min(1, 1600 / video.videoWidth);
      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      try {
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.9));
        if (!blob) throw new Error("Gambar dari kamera tidak dapat dibuat.");

        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(blob);
        preview.src = previewUrl;
        preview.hidden = false;
        video.hidden = true;
        guide.hidden = true;
        captureButton.hidden = true;
        retakeButton.hidden = false;
        stopCamera();

        status.textContent = "Foto diambil. Sedang membaca teks...";
        const formData = new FormData();
        formData.append("image", blob, "sampul.jpg");
        const response = await fetch("/ocr", { method: "POST", body: formData });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Pembacaan teks gagal.");

        const text = (result.text || "").replace(/\s+/g, " ").trim();
        textField.value = text;
        askButton.disabled = !text;
        status.textContent = text
          ? "Teks berhasil dibaca. Periksa hasilnya, lalu edit jika diperlukan."
          : "Teks belum terbaca. Coba foto ulang dengan sampul lebih jelas.";
      } catch (error) {
        captureButton.disabled = false;
        status.textContent = `Tidak dapat membaca sampul: ${error.message}`;
      } finally {
        captureInProgress = false;
      }
    }

    async function openCamera() {
      stopCamera();
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = null;
      preview.removeAttribute("src");
      preview.hidden = true;
      video.hidden = false;
      guide.hidden = false;
      captureButton.hidden = false;
      retakeButton.hidden = true;
      captureButton.disabled = true;
      textField.value = "";
      askButton.disabled = true;
      aiResult.textContent = "";
      consecutiveTextFrames = 0;
      detectionInProgress = false;
      autoCapture = true;
      status.textContent = "Membuka kamera...";

      if (!navigator.mediaDevices?.getUserMedia) {
        status.textContent = "Kamera memerlukan HTTPS atau localhost dan dukungan browser.";
        return;
      }

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 },
          },
        });
        video.srcObject = cameraStream;
        await video.play();
        const sampleScale = Math.min(320 / video.videoWidth, 240 / video.videoHeight);
        sampleCanvas.width = Math.max(1, Math.round(video.videoWidth * sampleScale));
        sampleCanvas.height = Math.max(1, Math.round(video.videoHeight * sampleScale));
        captureButton.disabled = false;
        status.textContent = "Arahkan sampul ke kamera. Menunggu teks terdeteksi...";
        window.setTimeout(inspectFrame, 700);
      } catch (error) {
        stopCamera();
        autoCapture = false;
        status.textContent = error.name === "NotAllowedError"
          ? "Izin kamera ditolak. Izinkan akses kamera di browser untuk mulai scan."
          : `Kamera tidak dapat dibuka: ${error.message}`;
      }
    }

    captureButton.addEventListener("click", captureImage);
    retakeButton.addEventListener("click", openCamera);
    textField.addEventListener("input", () => {
      askButton.disabled = !textField.value.trim();
      aiResult.textContent = "";
    });
    askButton.addEventListener("click", () => {
      if (!textField.value.trim()) return;
      aiResult.textContent = "AI sudah menjawab, di /ask";
    });

    window.addEventListener("pagehide", () => {
      stopCamera();
      if (previewUrl) URL.revokeObjectURL(previewUrl);
    });

    openCamera();
  </script>
{% endblock %}
