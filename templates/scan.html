{% extends "base.html" %}

{% block title %}Scan sampul · LiSiAI{% endblock %}

{% block content %}
  <div class="theme-page scan-page">
    <a href="/dashboard" class="back-link">← Kembali ke Dashboard</a>
    <header class="page-header">
      <div>
        <h1>Scan Cover</h1>
      </div>
    </header>

    <section class="scan-grid">
      <div class="panel camera-panel">
        <div class="camera-frame">
          <video id="camera" autoplay muted playsinline aria-label="Tampilan kamera untuk scan sampul"></video>
          <div id="camera-guide" class="camera-guide" aria-hidden="true"></div>
          <canvas id="detection-overlay" aria-hidden="true"></canvas>
          <img id="captured-preview" alt="Foto sampul yang diambil" hidden>
          <div id="capture-flash" class="capture-flash" aria-hidden="true"></div>
        </div>
        <canvas id="capture-canvas" hidden></canvas>
        <div class="detection-status" aria-live="polite">
          <span id="detection-dot" class="detection-dot"></span>
        </div>
        <div class="camera-actions">
          <button id="capture" class="button button-secondary" type="button" disabled>● Ambil Manual</button>
          <button id="retake" class="button" type="button" hidden>↻ Ulangi Scan</button>
        </div>
      </div>

      <div class="panel ocr-panel">
        <div class="panel-heading">
          <div>
            <h2>Hasil OCR</h2>
          </div>
          <span id="ocr-badge" class="ocr-badge">BELUM AKTIF</span>
        </div>
        <div class="ocr-content">
          <textarea id="extracted-text" name="text" rows="8" placeholder="Hasil OCR akan muncul setelah gambar diproses..." autocomplete="off"></textarea>
          <p class="edit-hint">Periksa atau edit teks sebelum meminta analisis AI.</p>
          <button id="ask-ai" class="button" type="button" disabled>✦ Tanya AI</button>
        </div>
        <div class="ai-output-wrap">
          <h3>Tanya LiSi-AI</h3>
          <div id="ai-result" class="ai-result" aria-live="polite">Analisis LiSi-AI akan ditampilkan di sini.</div>
        </div>
      </div>
    </section>
  </div>
  <script>
    const video = document.querySelector("#camera");
    const overlay = document.querySelector("#detection-overlay");
    const preview = document.querySelector("#captured-preview");
    const guide = document.querySelector("#camera-guide");
    const status = document.querySelector("#camera-status");
    const headingStatus = document.querySelector("#camera-heading-status");
    const cameraIndicator = document.querySelector("#camera-indicator");
    const detectionDot = document.querySelector("#detection-dot");
    const flash = document.querySelector("#capture-flash");
    const ocrBadge = document.querySelector("#ocr-badge");
    const ocrFooter = document.querySelector("#ocr-footer");
    const captureButton = document.querySelector("#capture");
    const retakeButton = document.querySelector("#retake");
    const askButton = document.querySelector("#ask-ai");
    const aiResult = document.querySelector("#ai-result");
    const canvas = document.querySelector("#capture-canvas");
    const textField = document.querySelector("#extracted-text");
    const context = canvas.getContext("2d");
    const sampleCanvas = document.createElement("canvas");
    sampleCanvas.width = 160;
    sampleCanvas.height = 120;
    const sampleContext = sampleCanvas.getContext("2d", { willReadFrequently: true });
    const overlayContext = overlay.getContext("2d");

    let cameraStream;
    let previewUrl;
    let captureInProgress = false;
    let detectionInProgress = false;
    let consecutiveBookFrames = 0;
    let previousFrame;
    let stableSince = 0;
    let autoCapture = true;

    function setStatus(message, state = "waiting") {
      status.textContent = message;
      headingStatus.textContent = message;
      detectionDot.className = `detection-dot ${state}`;
    }

    function stopCamera() {
      cameraStream?.getTracks().forEach((track) => track.stop());
      cameraStream = null;
      video.srcObject = null;
    }

    function drawDetections(result) {
      if (overlay.width !== sampleCanvas.width || overlay.height !== sampleCanvas.height) {
        overlay.width = sampleCanvas.width;
        overlay.height = sampleCanvas.height;
      }
      overlayContext.clearRect(0, 0, overlay.width, overlay.height);

      if (result.cover_corners?.length === 4) {
        overlayContext.beginPath();
        result.cover_corners.forEach(([x, y], index) => {
          if (index === 0) overlayContext.moveTo(x, y);
          else overlayContext.lineTo(x, y);
        });
        overlayContext.closePath();
        overlayContext.lineWidth = 3;
        overlayContext.strokeStyle = "#2ee58f";
        overlayContext.stroke();
      }

      overlayContext.lineWidth = 2;
      const textBoxes = result.text_boxes || [];
      overlayContext.strokeStyle = textBoxes.length ? "#ffd43b" : "#ff6b6b";
      for (const [x, y, width, height] of textBoxes) {
        overlayContext.strokeRect(x, y, width, height);
      }
    }

    function readFrameLuminance() {
      const pixels = sampleContext.getImageData(
        0,
        0,
        sampleCanvas.width,
        sampleCanvas.height,
      ).data;
      const luminance = new Uint8Array(sampleCanvas.width * sampleCanvas.height);
      for (let index = 0; index < luminance.length; index += 1) {
        const pixel = index * 4;
        luminance[index] = Math.round(
          pixels[pixel] * 0.299 + pixels[pixel + 1] * 0.587 + pixels[pixel + 2] * 0.114,
        );
      }
      return luminance;
    }

    function frameDifference(currentFrame, lastFrame) {
      if (!lastFrame) return Infinity;
      let totalDifference = 0;
      for (let index = 0; index < currentFrame.length; index += 1) {
        totalDifference += Math.abs(currentFrame[index] - lastFrame[index]);
      }
      return totalDifference / currentFrame.length;
    }

    async function inspectFrame() {
      if (!autoCapture || captureInProgress || detectionInProgress) return;
      if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
        window.setTimeout(inspectFrame, 300);
        return;
      }

      sampleContext.drawImage(video, 0, 0, sampleCanvas.width, sampleCanvas.height);
      const frame = readFrameLuminance();
      const difference = frameDifference(frame, previousFrame);
      previousFrame = frame;
      detectionInProgress = true;
      try {
        const blob = await new Promise((resolve) => sampleCanvas.toBlob(resolve, "image/jpeg", 0.5));
        if (!blob) throw new Error("Frame kamera tidak dapat dibuat.");
        const formData = new FormData();
        formData.append("image", blob, "frame.jpg");
        const response = await fetch("/detect-text", { method: "POST", body: formData });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Deteksi teks gagal.");

        drawDetections(result);
        const textDetected = result.text_detected;
        const now = performance.now();
        if (textDetected && difference < 8) {
          consecutiveBookFrames += 1;
          stableSince ||= now;
        } else if (textDetected) {
          consecutiveBookFrames = 1;
          stableSince = now;
        } else {
          consecutiveBookFrames = 0;
          stableSince = 0;
        }

        if (consecutiveBookFrames >= 3 && now - stableSince >= 1400) {
          setStatus("Teks terdeteksi dan stabil. Mengambil foto...", "detected");
          await captureImage();
          return;
        } else {
          setStatus(textDetected
            ? difference >= 8
              ? "Teks terlihat. Tahan kamera agar gambar stabil..."
              : result.cover_detected
                ? "Sampul dan teks terdeteksi. Menunggu gambar stabil..."
                : "Teks terdeteksi tanpa garis sampul. Menunggu gambar stabil..."
            : result.text_lines > 0
              ? "Pola teks terlihat. Jika tepi sampul tidak terbaca, pastikan minimal dua baris teks terlihat."
              : "Belum terdeteksi. Garis hijau menandai sampul, kotak kuning menandai teks.",
            textDetected ? "detected" : "waiting");
        }
      } catch (error) {
        consecutiveBookFrames = 0;
        stableSince = 0;
        drawDetections({});
        setStatus(`Deteksi lokal tidak tersedia: ${error.message}`, "error");
      } finally {
        detectionInProgress = false;
      }

      if (autoCapture) window.setTimeout(inspectFrame, 700);
    }

    async function captureImage() {
      if (captureInProgress || !video.videoWidth) return;
      captureInProgress = true;
      autoCapture = false;
      captureButton.disabled = true;
      setStatus("Menyiapkan foto sampul...", "detected");

      const scale = Math.min(1, 1600 / video.videoWidth);
      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      flash.classList.remove("active");
      void flash.offsetWidth;
      flash.classList.add("active");

      try {
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.9));
        if (!blob) throw new Error("Gambar dari kamera tidak dapat dibuat.");

        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(blob);
        preview.src = previewUrl;
        preview.hidden = false;
        video.hidden = true;
        overlay.hidden = true;
        guide.hidden = true;
        captureButton.hidden = true;
        retakeButton.hidden = false;
        cameraIndicator.classList.remove("active");
        cameraIndicator.classList.add("offline");
        stopCamera();

        ocrBadge.textContent = "MEMPROSES";
        ocrBadge.className = "ocr-badge processing";
        ocrFooter.innerHTML = '<span class="ocr-status-dot processing"></span> Sedang menjalankan OCR...';
        setStatus("Foto diambil. Sedang membaca teks...", "detected");
        const formData = new FormData();
        formData.append("image", blob, "sampul.jpg");
        const response = await fetch("/ocr", { method: "POST", body: formData });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Pembacaan teks gagal.");

        const text = (result.text || "").replace(/\s+/g, " ").trim();
        textField.value = text;
        askButton.disabled = !text;
        ocrBadge.textContent = text ? "SELESAI" : "TEKS TIDAK DITEMUKAN";
        ocrBadge.className = `ocr-badge ${text ? "complete" : "error"}`;
        ocrFooter.innerHTML = `<span class="ocr-status-dot ${text ? "complete" : "error"}"></span> ${text ? "OCR selesai" : "Tidak ada teks terbaca"}`;
        setStatus(text
          ? "Teks berhasil dibaca. Periksa hasilnya, lalu edit jika diperlukan."
          : "Teks belum terbaca. Coba foto ulang dengan sampul lebih jelas.",
          text ? "detected" : "error");
      } catch (error) {
        captureButton.disabled = false;
        ocrBadge.textContent = "GAGAL";
        ocrBadge.className = "ocr-badge error";
        ocrFooter.innerHTML = '<span class="ocr-status-dot error"></span> OCR gagal';
        setStatus(`Tidak dapat membaca sampul: ${error.message}`, "error");
      } finally {
        captureInProgress = false;
      }
    }

    async function openCamera() {
      stopCamera();
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = null;
      preview.removeAttribute("src");
      preview.hidden = true;
      video.hidden = false;
      overlay.hidden = false;
      overlayContext.clearRect(0, 0, overlay.width, overlay.height);
      guide.hidden = false;
      captureButton.hidden = false;
      retakeButton.hidden = true;
      captureButton.disabled = true;
      textField.value = "";
      askButton.disabled = true;
      aiResult.textContent = "";
      ocrBadge.textContent = "BELUM AKTIF";
      ocrBadge.className = "ocr-badge";
      ocrFooter.innerHTML = '<span class="ocr-status-dot"></span> OCR belum dijalankan';
      consecutiveBookFrames = 0;
      previousFrame = null;
      stableSince = 0;
      detectionInProgress = false;
      autoCapture = true;
      cameraIndicator.classList.remove("offline");
      setStatus("Membuka kamera...", "waiting");

      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("Kamera memerlukan HTTPS atau localhost dan dukungan browser.", "error");
        return;
      }

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 },
          },
        });
        video.srcObject = cameraStream;
        await video.play();
        const sampleScale = Math.min(320 / video.videoWidth, 240 / video.videoHeight);
        sampleCanvas.width = Math.max(1, Math.round(video.videoWidth * sampleScale));
        sampleCanvas.height = Math.max(1, Math.round(video.videoHeight * sampleScale));
        captureButton.disabled = false;
        cameraIndicator.classList.add("active");
        cameraIndicator.classList.remove("offline");
        setStatus("Arahkan sampul ke kamera. Menunggu teks terdeteksi...", "waiting");
        window.setTimeout(inspectFrame, 700);
      } catch (error) {
        stopCamera();
        autoCapture = false;
        cameraIndicator.classList.remove("active");
        cameraIndicator.classList.add("offline");
        setStatus(error.name === "NotAllowedError"
          ? "Izin kamera ditolak. Izinkan akses kamera di browser untuk mulai scan."
          : `Kamera tidak dapat dibuka: ${error.message}`, "error");
      }
    }

    captureButton.addEventListener("click", captureImage);
    retakeButton.addEventListener("click", openCamera);
    textField.addEventListener("input", () => {
      askButton.disabled = !textField.value.trim();
      aiResult.textContent = "";
    });
    askButton.addEventListener("click", async () => {
      const extractedText = textField.value.trim();
      if (!extractedText) return;

      askButton.disabled = true;
      aiResult.textContent = "Meminta analisis dari AI lokal...";
      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task: "book_scan", extracted_text: extractedText }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "AI lokal gagal menjawab.");
        aiResult.textContent = result.answer;
      } catch (error) {
        aiResult.textContent = `Tidak dapat memperoleh jawaban: ${error.message}`;
      } finally {
        askButton.disabled = !textField.value.trim();
      }
    });

    window.addEventListener("pagehide", () => {
      stopCamera();
      if (previewUrl) URL.revokeObjectURL(previewUrl);
    });

    openCamera();
  </script>
{% endblock %}
